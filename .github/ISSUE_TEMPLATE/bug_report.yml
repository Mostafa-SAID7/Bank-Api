name: 🐛 Bug Report
description: Report a reproducible bug in the FinBank API
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        > ⚠️ If this bug has **security implications**, do NOT submit here. Use the [private Security Advisory](https://github.com/Mostafa-SAID7/Bank-Api/security/advisories/new) instead.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: When I call POST /api/accounts, the response returns...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Authenticate via POST /api/auth/login
        2. Call GET /api/accounts/{id} with a valid token
        3. Observe the response...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include error messages, stack traces, or HTTP response bodies.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected Module / Domain
      description: Which banking domain is affected?
      multiple: true
      options:
        - Identity / Authentication
        - Core Banking / Accounts
        - Core Banking / Transactions
        - Payments / Transfers
        - Payments / Bill Pay
        - Loans
        - Cards
        - Deposits
        - Notifications
        - Statements
        - Audit / Compliance
        - Infrastructure / Database
        - CI/CD / DevOps
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical — data loss, financial corruption, or security exposure"
        - "High — core feature completely broken"
        - "Medium — feature partially broken, workaround exists"
        - "Low — minor issue, cosmetic"
    validations:
      required: true

  - type: checkboxes
    id: security_impact
    attributes:
      label: Security Impact
      description: Check all that apply. If any box is checked, consider private disclosure.
      options:
        - label: This bug could expose user financial data
        - label: This bug affects authentication or authorization
        - label: This bug affects transaction integrity
        - label: No security impact

  - type: input
    id: dotnet_version
    attributes:
      label: .NET Version
      placeholder: "e.g. 9.0.308"
    validations:
      required: true

  - type: input
    id: postgres_version
    attributes:
      label: PostgreSQL Version
      placeholder: "e.g. PostgreSQL 16 on Neon"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - Windows
        - macOS
        - Docker / Container
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Trace
      description: Paste any relevant log output. This will be rendered as code.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I checked the [documentation](https://github.com/Mostafa-SAID7/Bank-Api/tree/main/docs)
          required: true
        - label: This is not a security vulnerability (use private advisory for those)
          required: true
