# Automatic labeling configuration for Bank API (modular monolith)

# ── Backend / C# source ──────────────────────────────────────────
backend:
  - "src/**/*.cs"
  - "src/**/*.csproj"
  - "src/**/*.sln"

# ── Modules (vertical slices) ───────────────────────────────────
modules:
  - "src/Modules/**/*"

# ── BuildingBlocks & shared contracts ───────────────────────────
building-blocks:
  - "src/BuildingBlocks/**/*"
  - "src/Bank.Contracts/**/*"

# ── DevOps and Infrastructure ───────────────────────────────────
devops:
  - "devops/**/*"
  - ".github/**/*"
  - "**/Dockerfile*"
  - "**/docker-compose*"
  - "*.yml"
  - "*.yaml"

# ── Database / migrations ───────────────────────────────────────
database:
  - "**/*Migration*"
  - "**/Data/**/*"
  - "**/Migrations/**/*"
  - "**/*DbContext*"

# ── Security ────────────────────────────────────────────────────
security:
  - "**/Auth*"
  - "**/Security*"
  - "**/*Security*"
  - "**/Middleware/**/*"
  - ".github/SECURITY.md"

# ── API / Controllers ───────────────────────────────────────────
api:
  - "src/Bank.Api/Controllers/**/*"
  - "src/Modules/*/Presentation/**/*"
  - "**/*Controller.cs"
  - "**/DTOs/**/*"

# ── Documentation ───────────────────────────────────────────────
documentation:
  - "docs/**/*"
  - "**/*.md"
  - "README.md"

# ── Configuration ───────────────────────────────────────────────
configuration:
  - "**/appsettings*.json"
  - "**/launchSettings.json"
  - "**/*.config"
  - "**/Program.cs"

# ── Testing ─────────────────────────────────────────────────────
testing:
  - "src/**/*Tests/**/*"
  - "src/**/*Test*.cs"

# ── Dependencies ────────────────────────────────────────────────
dependencies:
  - "src/**/*.csproj"
  - "src/**/NuGet.Config"

# ── Banking domain labels ────────────────────────────────────────
account-management:
  - "src/**/Account*"
  - "src/**/*Account*"

transaction-processing:
  - "src/**/Transaction*"
  - "src/**/*Transaction*"

payments:
  - "src/Modules/Payments/**/*"

notifications:
  - "src/Modules/Notifications/**/*"

user-management:
  - "src/**/User*"
  - "src/**/*User*"
  - "src/**/Identity/**/*"