# Railpack configuration for Bank API
# This helps Railpack understand the project structure and deployment requirements

[build]
# Use Docker for containerized deployment
type = "docker"
dockerfile = "Dockerfile"

[runtime]
# .NET runtime version
dotnet_version = "9.0"

[ports]
# Port the application listens on internally
port = 5000

[environment]
# Default environment for production
ASPNETCORE_ENVIRONMENT = "Production"

# Database connection (configure in Railpack dashboard)
DATABASE_URL = "postgresql://user:password@host:5432/dbname"

# JWT settings (configure in Railpack dashboard with actual values)
JwtSettings__SecretKey = "your-secret-key"

# Other required settings
ASPNETCORE_URLS = "http://+:5000"

[health_check]
# Health check endpoint
path = "/health"
interval = 30
timeout = 3
